<style>
#lingnan-review { color-scheme:light; --ln-decoration:1; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
#lingnan-review * { box-sizing:border-box; }

#lingnan-review .ln-app { --ln-bg:#eeeae0; --ln-paper:#fbf8ef; --ln-ink:#263e38; --ln-muted:#566760; --ln-line:#c2c8b7; --ln-accent:#245c4f; --ln-soft:#dee5d6; --ln-gold:#aa7338; --ln-on:#fff9eb; position:relative; overflow:hidden; background:var(--ln-bg); color:var(--ln-ink); border:1px solid var(--ln-line); font-size:14px; line-height:1.6; }

 const steps = ['创意','内容','美术提示词','概念图','成品'];
 const projects = [{name:'西关雨后',type:'小说',stage:1},{name:'一扇清风',type:'文创作品',stage:3}];
 const initialDraft='一句话概念\n以当代西关街区为背景，讲述雨后街巷中人与人的一次相遇。\n\n创作方向\n从日常生活的细节展开，保留骑楼下的步行体验、窗内外的光线与街坊之间的联系。具体人物与情节仍待补充。';
 root.querySelectorAll('.ln-app').forEach(app => {
  const d=designs[app.dataset.theme];
  let stage=1, projectName='西关雨后', draft=initialDraft;
  app.innerHTML=`<header class="ln-top"><span class="ln-wordmark">创意工作台</span><span class="ln-topnote">岭南文化创作 · 视觉预览</span></header>
   <div class="ln-home"><div class="ln-hero"><div class="ln-intro"><p class="ln-eyebrow">岭南 / 创意之间</p><h2>${d.headline}</h2><p class="ln-subtitle">${d.subtitle}</p></div><div class="ln-art" aria-hidden="true">${d.art}<span class="ln-art-label">${d.detail}</span></div></div>
   <div class="ln-content"><div class="ln-listhead"><h3>我的创意</h3><div class="ln-tools"><input class="ln-search" type="search" placeholder="搜索项目名称" aria-label="搜索示例项目"><button type="button" class="ln-btn" data-new>＋ 新建创意</button></div></div>
   <div class="ln-grid">${projects.map((p,i)=>`<button type="button" class="ln-project" data-project="${i}" aria-label="预览${p.name}项目"><span class="ln-cover" style="display:block" aria-hidden="true">${d.covers[i]}<span class="ln-cover-label">概念占位图</span></span><span class="ln-cardbody"><span class="ln-cardtitle">${p.name}</span><span class="ln-meta"><span>${p.type} · 今天编辑</span><span class="ln-tag">${steps[p.stage]}</span></span></span></button>`).join('')}<button type="button" class="ln-project ln-new" data-new><span class="ln-plus">＋</span><span>从一句想法开始</span></button><p class="ln-noresults" hidden>没有匹配的示例项目</p></div></div>
   <footer class="ln-bottom"><span>预览示例 · 项目卡可进入编辑页</span><span class="ln-swatches" aria-label="方案配色">${d.colors.map(color=>`<i style="--swatch:${color}"></i>`).join('')}</span></footer></div>
   <div class="ln-editor" hidden><div class="ln-projectbar"><button type="button" class="ln-textbtn" data-back>← 返回项目列表</button><span data-name>西关雨后</span><span class="ln-save">预览草稿 · 未持久化</span></div><nav class="ln-steps" aria-label="创作阶段">${steps.map((s,i)=>`<button type="button" class="ln-step" data-step="${i}">${String(i+1).padStart(2,'0')} ${s}</button>`).join('')}</nav>
   <div class="ln-sheet"><h3 data-stage-title>内容</h3><p data-stage-hint>示例内容，可输入文字体验排版。</p><div data-writing><textarea class="ln-draft" aria-label="预览内容编辑区"></textarea></div><div data-concepts hidden><div class="ln-grid"><div class="ln-project"><div class="ln-cover" aria-hidden="true">${d.covers[1]}</div><div class="ln-cardbody"><span class="ln-cardtitle">葵扇 · 物件</span><span class="ln-meta">概念占位图</span></div></div></div></div><div data-final hidden><p>成品服务尚未接入。</p><button type="button" class="ln-btn" disabled>生成完整作品 · 未接入</button></div><input class="ln-request" aria-label="修改要求预览" placeholder="用一句话描述你想如何修改……"><div class="ln-actions"><div data-primary-actions><button type="button" class="ln-btn secondary" data-demo>按要求修改</button></div><button type="button" class="ln-btn" data-next>继续 →</button></div><div class="ln-notice" role="status" aria-live="polite">仅体验布局与交互，不调用生成服务或保存项目。</div></div></div>`;
  const home=app.querySelector('.ln-home'), editor=app.querySelector('.ln-editor'), writing=app.querySelector('.ln-draft');
  writing.value=draft;
  function renderStage(){
   app.querySelector('[data-stage-title]').textContent=steps[stage];
   app.querySelector('[data-stage-hint]').textContent=stage<3?'示例内容，可输入文字体验排版。':stage===3?'角色、地图、物件；这里只展示物件占位示例。':'当前视觉预览不提供实际作品生成。';
   app.querySelectorAll('[data-step]').forEach(btn=>{if(Number(btn.dataset.step)===stage)btn.setAttribute('aria-current','step');else btn.removeAttribute('aria-current');});
   app.querySelector('[data-writing]').hidden=stage>=3;
   app.querySelector('[data-concepts]').hidden=stage!==3;
   app.querySelector('[data-final]').hidden=stage!==4;
   app.querySelector('.ln-request').hidden=stage===4;
   app.querySelector('[data-next]').hidden=stage===4;
   app.querySelector('[data-primary-actions]').hidden=stage===4;
   app.querySelector('[data-primary-actions]').innerHTML=stage===3?'<button type="button" class="ln-btn secondary" data-demo>保存</button><button type="button" class="ln-btn secondary" data-demo>返工</button><button type="button" class="ln-textbtn" data-demo>删除</button>':'<button type="button" class="ln-btn secondary" data-demo>按要求修改</button>';
  }
  function openProject(name,start){projectName=name;stage=start;app.querySelector('[data-name]').textContent=projectName;home.hidden=true;editor.hidden=false;renderStage();}
  app.addEventListener('click',event=>{
   const button=event.target.closest('button'); if(!button)return;
   if(button.hasAttribute('data-project')){const p=projects[Number(button.dataset.project)];openProject(p.name,p.stage);}
   if(button.hasAttribute('data-new')){writing.value='';openProject('新创意 · 预览',0);}
   if(button.hasAttribute('data-back')){home.hidden=false;editor.hidden=true;}
   if(button.hasAttribute('data-step')){stage=Number(button.dataset.step);renderStage();}
   if(button.hasAttribute('data-next')){stage=Math.min(stage+1,4);renderStage();}
   if(button.hasAttribute('data-demo'))app.querySelector('.ln-notice').textContent='这是「'+button.textContent+'」的按钮样式预览；未执行生成、保存或删除。';
  });
  writing.addEventListener('input',()=>{draft=writing.value;app.querySelector('.ln-save').textContent='预览草稿已修改 · 未持久化';});
  app.querySelector('.ln-search').addEventListener('input',event=>{
   const query=event.target.value.trim(); let count=0;
   app.querySelectorAll('[data-project]').forEach(card=>{card.hidden=!projects[Number(card.dataset.project)].name.includes(query);if(!card.hidden)count++;});
   app.querySelector('.ln-noresults').hidden=count>0;
  });
 });
 const settings={decoration:100};
 function applyDecoration(){root.style.setProperty('--ln-decoration',String(settings.decoration/100));}
 applyDecoration();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDecoration});tweak.addSlider(settings,'decoration',{label:'首页建筑与工艺装饰强度',min:30,max:100,step:5,unit:'%'});}
})();
</script>
